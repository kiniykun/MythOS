<!DOCTYPE html><html><head><meta charset="utf-8"><title>Music</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--accent:#4cc2ff;--bg:#1c1c1e;--side:#252528;--line:rgba(255,255,255,.09);--fg:#fff;--mut:rgba(235,235,245,.6);--hover:rgba(255,255,255,.07);--lcd:#2d2d30;--row:rgba(255,255,255,.045);--shadow:0 20px 60px rgba(0,0,0,.55);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
html.light{--bg:#fff;--side:#f1f1f3;--line:rgba(0,0,0,.09);--fg:#1d1d1f;--mut:rgba(60,60,67,.62);--hover:rgba(0,0,0,.055);--lcd:#ebebee;--row:rgba(0,0,0,.035);--shadow:0 20px 50px rgba(0,0,0,.22)}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{font:13px var(--font);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;fill:currentColor}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:6px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
.top{height:68px;flex-shrink:0;display:grid;grid-template-columns:1fr minmax(280px,560px) 1fr;align-items:center;gap:16px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);position:relative;z-index:12}
.tl,.trr{display:flex;align-items:center;gap:4px}.trr{justify-content:flex-end;gap:8px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg);opacity:.78;position:relative;transition:background .15s,opacity .15s,transform .1s}
.ib:hover{background:var(--hover);opacity:1}.ib:active{transform:scale(.92)}.ib svg{width:19px;height:19px}
.ib.on{color:var(--accent);opacity:1}.ib.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.ib.big{width:42px;height:42px;opacity:1}.ib.big svg{width:26px;height:26px}
.ib.sm{display:none}
.rep1{position:absolute;right:4px;top:5px;font-size:8px;font-weight:800;line-height:1;display:none}.ib.one .rep1{display:block}
.lcd{height:50px;border-radius:9px;background:var(--lcd);display:flex;align-items:stretch;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.lart{width:50px;flex-shrink:0;background:var(--lcd);display:grid;place-items:center;position:relative;overflow:hidden}
.lart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.lart svg{width:22px;height:22px;opacity:.45}
.lmid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 14px 0 12px;gap:1px}
.lt{text-align:center;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.lt small{display:block;font-weight:400;font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.seek{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums;margin-top:3px}.seek span{width:30px}.seek span:first-child{text-align:left}.seek span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(to right,var(--fg) var(--p,0%),rgba(128,128,128,.32) var(--p,0%));cursor:pointer;flex:1;transition:height .12s}
input[type=range]:hover{height:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border:0}
input[type=range]:hover::-webkit-slider-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
.vol{display:flex;align-items:center;gap:8px;color:var(--mut)}.vol svg{width:16px;height:16px}.vol input{width:92px;flex:none}

/* ---------- body ---------- */
.body{flex:1;display:flex;min-height:0;position:relative}
.side{width:216px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.srch{display:flex;align-items:center;gap:7px;height:30px;border-radius:8px;background:var(--hover);padding:0 9px;margin-bottom:12px;color:var(--mut)}
.srch svg{width:14px;height:14px;flex-shrink:0}.srch input{flex:1;min-width:0;background:none;border:0;user-select:text}.srch input::placeholder{color:var(--mut)}
.sec{font-size:11px;font-weight:600;color:var(--mut);padding:10px 10px 5px;letter-spacing:.01em}
.nv{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left;width:100%}
.nv svg{width:19px;height:19px;color:var(--accent)}.nv:hover{background:var(--hover)}.nv.on{background:var(--hover);font-weight:600}.nv .n{margin-left:auto;color:var(--mut);font-size:12px;font-weight:400}
.sp{flex:1}
.addb{display:flex;align-items:center;justify-content:center;gap:8px;height:34px;border-radius:8px;background:var(--accent);color:#000;font-weight:600;margin-top:8px}.addb:hover{filter:brightness(1.08)}.addb svg{width:16px;height:16px}
.stage{flex:1;min-width:0;position:relative;overflow:hidden;display:flex}
.view{display:none;flex:1;min-width:0;position:relative}.view.on{display:flex}

/* ---------- now playing ---------- */
.nbg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 60% at 25% 15%,color-mix(in srgb,var(--c1,#555) 38%,transparent),transparent 70%),radial-gradient(60% 60% at 85% 85%,color-mix(in srgb,var(--c2,#444) 30%,transparent),transparent 70%);transition:opacity .6s}
.now{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;position:relative}
.art{width:min(340px,48vh,70%);aspect-ratio:1;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;background:var(--lcd);display:grid;place-items:center;position:relative;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.paused .art{transform:scale(.9)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.art>svg{width:34%;height:34%;color:#fff;opacity:.9}
.meta{text-align:center;max-width:100%;padding:0 10px}.meta b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{display:block;font-size:15px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;color:var(--mut);margin-top:2px;font-size:12.5px}
canvas#vz{width:min(340px,70%);height:34px;opacity:.85;pointer-events:none}
.emptyn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.emptyn .go{margin-top:8px;padding:8px 20px;border-radius:18px;background:var(--accent);color:#000;font-weight:600}
.upn{width:320px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);position:relative;backdrop-filter:blur(20px)}
.upn.off{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}.ph h2{font-size:17px;font-weight:700}.ph span{color:var(--mut);font-size:12px}
.ql{flex:1;overflow:auto;padding:0 8px 12px}

/* ---------- track rows ---------- */
.tr{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:8px;cursor:default;position:relative}
.tr:hover{background:var(--hover)}.tr.on{background:var(--hover)}
.th{width:40px;height:40px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;background-size:cover;background-position:center}
.th svg{width:18px;height:18px;opacity:.9}.th .pl{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center}.tr:hover .th .pl{display:grid}.tr:hover .th>svg{opacity:0}
.th .pl svg{opacity:1;width:20px;height:20px}
.eq{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:11px 0}.tr:hover .eq{display:none}
.eq u{width:3px;background:#fff;border-radius:1px;height:6px;animation:eq .9s infinite ease-in-out}.eq u:nth-child(2){animation-delay:.2s}.eq u:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.paused .eq u{animation-play-state:paused}
.tm{flex:1;min-width:0}.tm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr.on .tm b{color:var(--accent)}.tm small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.du{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px}
.tr .x{opacity:0;width:24px;height:24px;border-radius:50%;color:var(--mut);display:grid;place-items:center}.tr:hover .x{opacity:1}.tr .x:hover{background:var(--hover);color:#ff6b6b}.tr .x svg{width:12px;height:12px}
.empty{color:var(--mut);text-align:center;padding:50px 20px;line-height:1.6}
.empty b{color:var(--fg)}

/* ---------- songs view ---------- */
.songs{flex:1;overflow:auto;padding:22px 26px 30px}
.songs h1{font-size:28px;font-weight:700;letter-spacing:-.02em}.songs .sub{color:var(--mut);margin:2px 0 16px}
.songs .tr{padding:7px 10px}.songs .tr:nth-child(odd){background:var(--row)}.songs .tr:hover,.songs .tr.on{background:var(--hover)}

.drop{position:absolute;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;font-size:20px;font-weight:600;z-index:60;border:2px dashed var(--accent);color:#fff;backdrop-filter:blur(6px)}.drop.on{display:grid}

/* ---------- lyrics ---------- */

/* ---------- discover ---------- */
.find{flex:1;overflow:auto;padding:24px 28px 40px;min-width:0}
.find h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.fsr{display:flex;align-items:center;gap:9px;height:38px;border-radius:10px;background:var(--hover);padding:0 13px;margin:14px 0 12px;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
.fsr:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 0 0 1px var(--accent)}
.fsr svg{width:16px;height:16px;flex:none}.fsr input{flex:1;min-width:0;background:none;border:0;font-size:14px;user-select:text;color:var(--fg)}.fsr input::placeholder{color:var(--mut)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--hover);margin-bottom:6px}
.seg button{padding:5px 13px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--mut)}.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.28)}.seg small{opacity:.7;font-weight:400;margin-left:4px}
.fh{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 6px}.fh b{font-size:18px;font-weight:700;letter-spacing:-.01em}.fh span{color:var(--mut);font-size:12px}
.fnote{color:var(--mut);padding:18px 4px;font-size:13px}
.bd{font-size:10px;font-weight:600;letter-spacing:.02em;padding:2px 6px;border-radius:5px;background:var(--hover);color:var(--mut);flex:none}.bd.full{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.tr .ad{opacity:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}.tr:hover .ad{opacity:1}.tr .ad:hover{background:var(--hover);color:var(--fg)}.tr .ad svg{width:14px;height:14px}
.fup{margin-top:30px;padding:16px 18px;border-radius:12px;background:var(--row);display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--mut)}.fup button{padding:7px 16px;border-radius:8px;background:var(--hover);color:var(--fg);font-weight:600}.fup button:hover{background:var(--line)}
.addb.alt{background:var(--hover);color:var(--fg)}
.emptyn .go.alt{background:var(--hover);color:var(--fg)}.emptyn .btns{display:flex;gap:8px;margin-top:8px}.emptyn .btns .go{margin-top:0}
#lv{container-type:inline-size;position:absolute;inset:0;z-index:8;display:none;overflow:hidden;background:#0d0d0f;color:#fff;--c1:#6a4bd6;--c2:#d6457d;--c3:#2b79d6;--c4:#d68a2b}
#lv.on{display:flex;animation:lvin .35s ease both}
@keyframes lvin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fluid{position:absolute;inset:0;overflow:hidden;filter:saturate(1.35)}
.fluid i{position:absolute;width:80%;aspect-ratio:1;border-radius:50%;filter:blur(70px);opacity:.78;will-change:transform;transition:background 1s}
.fluid i:nth-child(1){background:var(--c1);left:-20%;top:-30%;animation:d1 19s ease-in-out infinite alternate}
.fluid i:nth-child(2){background:var(--c2);right:-25%;top:-10%;animation:d2 23s ease-in-out infinite alternate}
.fluid i:nth-child(3){background:var(--c3);left:-5%;bottom:-45%;animation:d3 27s ease-in-out infinite alternate}
.fluid i:nth-child(4){background:var(--c4);right:-15%;bottom:-40%;width:65%;animation:d4 21s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(35%,25%) scale(1.15)}}@keyframes d2{to{transform:translate(-30%,35%) scale(.9)}}@keyframes d3{to{transform:translate(30%,-30%) scale(1.2)}}@keyframes d4{to{transform:translate(-35%,-25%) scale(1.1)}}
.lsh{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.45))}
.lside{position:relative;width:clamp(180px,23%,280px);flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px 6px 28px 30px}
.lcov{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.6);background:rgba(255,255,255,.12);display:grid;place-items:center}.lcov img{width:100%;height:100%;object-fit:cover}.lcov svg{width:40%;opacity:.85}
.linfo b{display:block;font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em}.linfo span{display:block;font-size:16px;color:rgba(255,255,255,.62);margin-top:3px}
.lcr{font-size:11px;color:rgba(255,255,255,.34);margin-top:10px}
.lsync{display:flex;align-items:center;gap:4px;font-size:11.5px;color:rgba(255,255,255,.55)}
.lsync button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:14px;line-height:1}.lsync button:hover{background:rgba(255,255,255,.26)}.lsync span{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.lbody{position:relative;flex:1;min-width:0;overflow-y:auto;padding:38vh 40px 46vh 14px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent 0,#000 12%,#000 80%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 12%,#000 80%,transparent 100%)}
.lbody::-webkit-scrollbar{display:none}
.ll{font-size:clamp(30px,7.4cqw,76px);font-weight:700;letter-spacing:-.03em;line-height:1.13;padding:11px 24px 11px 22px;margin:4px 0;border-radius:20px;opacity:.34;filter:blur(var(--b,0px));transform:scale(.9);transform-origin:left center;transition:opacity .45s,filter .45s,transform .6s cubic-bezier(.2,.8,.2,1),background .2s;cursor:pointer;word-break:break-word;text-wrap:pretty;will-change:transform,opacity;font-family:var(--font)}
.ll .w{display:inline-block;white-space:pre;color:#fff}
.ll.on{opacity:1;transform:scale(1);filter:none}
.ll.on .w{color:transparent;background:linear-gradient(90deg,#fff calc(var(--p,0)*114% - 14%),rgba(255,255,255,.34) calc(var(--p,0)*114%));-webkit-background-clip:text;background-clip:text}.ll.on .w.cur{text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,255,255,.45))}
.ll.done .w{color:#fff;background:none}
.ll:hover{opacity:.82;filter:none;background:rgba(255,255,255,.1)}.ll.on:hover{background:rgba(255,255,255,.07)}
.ll.pl{cursor:default;opacity:.92;filter:none;transform:none;font-size:clamp(24px,6cqw,58px);font-weight:700;padding:6px 22px;line-height:1.2}
#lv.plain .lsync{display:none}.ll.pl:hover{background:none;opacity:.92}
.ll.dots{display:flex;gap:8px;padding:18px 20px}
.ll.dots em{width:22px;height:22px;border-radius:50%;background:#fff;display:block;opacity:calc(.28 + var(--k,0)*.72);transform:scale(calc(.78 + var(--k,0)*.3))}
.ll.dots.on em{animation:breath 3.2s ease-in-out infinite}
@keyframes breath{0%,100%{translate:0 0}50%{translate:0 -2px}}
.lmsg{font-size:clamp(26px,5cqw,44px);font-weight:700;color:rgba(255,255,255,.78);padding:10px 20px;line-height:1.35}.lmsg small{display:block;font-size:14px;font-weight:400;color:rgba(255,255,255,.52);margin:8px 0 16px}
.lsr{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px}.lsr input{background:rgba(255,255,255,.14);border:0;color:#fff;padding:10px 13px;border-radius:9px;font-size:14px;user-select:text;min-width:150px;flex:1}.lsr input::placeholder{color:rgba(255,255,255,.45)}.lsr button{background:#fff;color:#000;border-radius:9px;padding:10px 18px;font-weight:600;font-size:14px}.lsr button.g{background:rgba(255,255,255,.18);color:#fff}
.lsk{display:flex;flex-direction:column;gap:18px;padding:14px 20px}.lsk i{height:34px;border-radius:12px;background:rgba(255,255,255,.14);animation:pulse 1.4s ease-in-out infinite}.lsk i:nth-child(2){width:80%;animation-delay:.15s}.lsk i:nth-child(3){width:90%;animation-delay:.3s}.lsk i:nth-child(4){width:62%;animation-delay:.45s}
@keyframes pulse{50%{opacity:.4}}
.lx{position:absolute;top:14px;right:16px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;backdrop-filter:blur(10px)}.lx:hover{background:rgba(255,255,255,.28)}.lx svg{width:14px;height:14px}
@media(prefers-reduced-motion:reduce){.fluid i{animation:none}.ll,.ll .w{transition:none}}
@media(max-width:880px){.upn{display:none}}
@media(max-width:760px){.lside{display:none}.side{display:none}.top{grid-template-columns:auto 1fr auto;gap:8px;padding:0 10px}.vol{display:none}.ib.sm{display:grid}}
@media(max-width:560px){.tl .ib.hide{display:none}.top{height:64px}}

#lv .ll{font-family:var(--lf,inherit);font-size:calc(clamp(30px,7.4cqw,76px)*var(--ls,1));font-weight:var(--lw,700);text-align:var(--la,left)}
#lv .ll.pl{font-family:var(--lf,inherit);font-size:calc(clamp(24px,6cqw,58px)*var(--ls,1));font-weight:var(--lw,700);text-align:var(--la,left)}
#lv[data-al=center] .ll{transform-origin:center center}#lv[data-al=center] .ll.dots{justify-content:center}
#lv.noblur .ll{filter:none!important}#lv.nofluid .fluid i{animation:none}
.lgear{align-self:flex-start;padding:6px 14px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;letter-spacing:.02em}.lgear:hover{background:rgba(255,255,255,.26)}
.lpan{position:absolute;left:16px;bottom:16px;width:310px;max-height:84%;overflow:auto;z-index:12;display:none;padding:14px;border-radius:16px;background:rgba(24,24,28,.86);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);color:#fff;font-size:12.5px}.lpan.on{display:block}
.lph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:6px}.lph button{color:#fff;font-size:20px;line-height:1;width:26px;height:26px;border-radius:50%}.lph button:hover{background:rgba(255,255,255,.15)}
.lpl{margin:12px 0 6px;color:rgba(255,255,255,.62);font-weight:600;display:flex;justify-content:space-between}
.lfonts{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:190px;overflow:auto;padding-right:2px}.lfonts button{padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;text-align:left;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lfonts button small{display:block;font:500 10.5px var(--font);color:rgba(255,255,255,.55);margin-top:2px}.lfonts button:hover{background:rgba(255,255,255,.16)}.lfonts button.on{box-shadow:0 0 0 2px var(--accent);background:rgba(255,255,255,.14)}
.lpr{display:flex;gap:6px;margin-top:8px}.lpr input{flex:1;min-width:0;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.1);color:#fff;padding:0 10px}.lpr button{padding:0 14px;border-radius:8px;background:var(--accent);color:#000;font-weight:700}
.lpan input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- sound output: earbuds / Bluetooth / speakers ---------- */
(function(){var b=$('ob');if(!b)return;var md=navigator.mediaDevices,pan=document.createElement('div'),known=null,sink='default';
try{sink=localStorage.getItem('mus_sink')||'default'}catch(e){}
pan.style.cssText='position:fixed;top:52px;right:12px;width:300px;max-height:70vh;overflow:auto;background:var(--card,#222);color:var(--fg,#fff);border:1px solid rgba(128,128,128,.35);border-radius:10px;padding:8px;box-shadow:0 16px 50px rgba(0,0,0,.5);z-index:99;display:none;font:13px system-ui,sans-serif';document.body.appendChild(pan);
function ico(l){return/bluetooth|airpods|buds|headphone|headset|earphone|earbud|hands-free|wh-|wf-/i.test(l)?'🎧':/speaker|built-in/i.test(l)?'🔊':'🔈'}
function save(id){sink=id;try{localStorage.setItem('mus_sink',id)}catch(e){}}
function apply(id,label){if(!au.setSinkId){note('This browser can’t choose an output. Use your system sound settings.');return Promise.resolve()}
 return au.setSinkId(id).then(function(){save(id);b.title='Playing on '+(label||'default output');draw()},function(e){note('Couldn’t switch: '+(e&&e.message||'blocked'))})}
var msg='';function note(t){msg=t;draw()}
function draw(){if(!md||!md.enumerateDevices){pan.innerHTML='<div style="padding:8px">This browser can’t list sound devices.</div>';return}
 md.enumerateDevices().then(function(ds){ds=ds.filter(function(d){return d.kind==='audiooutput'});
  pan.innerHTML='<div style="padding:6px 8px 8px;font-weight:600">Sound output</div>'+(msg?'<div style="padding:4px 8px 8px;opacity:.8">'+esc(msg)+'</div>':'')+
  ds.map(function(d,i){var l=d.label||(d.deviceId==='default'?'System default':'Audio output '+(i+1)),on=(sink===d.deviceId)||(sink==='default'&&d.deviceId==='default');
   return'<div data-id="'+esc(d.deviceId)+'" data-l="'+esc(l)+'" style="display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer;'+(on?'background:rgba(128,128,128,.22)':'')+'"><span>'+ico(l)+'</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l)+'</span>'+(on?'<b>✓</b>':'')+'</div>'}).join('')+
  '<button id="odet" style="width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit;cursor:pointer;font:inherit">Detect earbuds / Bluetooth…</button><div style="padding:8px 8px 2px;opacity:.6;font-size:12px">Songs you play from Files or Find use this output. YouTube songs follow your system output.</div>';
  [].forEach.call(pan.querySelectorAll('[data-id]'),function(e){e.onclick=function(){msg='';apply(e.dataset.id,e.dataset.l)}});
  $('odet').onclick=detect;known=ds.map(function(d){return d.deviceId})})}
function detect(){msg='';var p=md.selectAudioOutput?md.selectAudioOutput():md.getUserMedia({audio:true}).then(function(st){st.getTracks().forEach(function(t){t.stop()});return null});
 p.then(function(d){if(d&&d.deviceId)return apply(d.deviceId,d.label);draw()},function(){note('No device chosen. Connect your earbuds in system Bluetooth settings first, then try again.')})}
b.onclick=function(e){e.stopPropagation();var o=pan.style.display==='block';pan.style.display=o?'none':'block';if(!o)draw()};
document.addEventListener('click',function(e){if(!pan.contains(e.target)&&e.target!==b)pan.style.display='none'});
if(md&&md.addEventListener)md.addEventListener('devicechange',function(){md.enumerateDevices().then(function(ds){ds=ds.filter(function(d){return d.kind==='audiooutput'});var ids=ds.map(function(d){return d.deviceId}),added=ds.filter(function(d){return known&&known.indexOf(d.deviceId)<0}),gone=known&&sink!=='default'&&ids.indexOf(sink)<0;
  if(gone){try{au.pause()}catch(e){}save('default');au.setSinkId&&au.setSinkId('default').catch(function(){});msg='Your earbuds or speaker disconnected, so playback paused.';pan.style.display='block'}
  else if(added.length){msg='New output found: '+(added[0].label||'audio device')+'. Pick it below to play there.';pan.style.display='block'}
  known=ids;draw()})});
if(md&&md.enumerateDevices)md.enumerateDevices().then(function(ds){known=ds.filter(function(d){return d.kind==='audiooutput'}).map(function(d){return d.deviceId});if(sink!=='default'&&au.setSinkId)au.setSinkId(sink).catch(function(){save('default')})});
})();

function set(bb,bt,sv){lv.style.setProperty('--bb',bb);lv.style.setProperty('--bt',bt);ci.value=bb;[].forEach.call(bx.querySelectorAll('.sw2'),function(x){x.classList.toggle('on',x.dataset.bb.toLowerCase()===bb.toLowerCase())});if(sv)try{localStorage.setItem('music_brat_color',JSON.stringify([bb,bt]))}catch(e){}}

bx.onclick=function(e){var x=e.target.closest('.sw2');if(x)set(x.dataset.bb,x.dataset.bt,1)};
ci.oninput=function(){set(ci.value,lum(ci.value)>.55?'#000':'#fff',1)}})();

var f='type';try{f=localStorage.getItem('music_brat_fx')||'type'}catch(e){}set(f==='word'?'word':'type');b.onclick=function(e){var x=e.target.closest('button');if(x)set(x.dataset.fx,1)}})();
