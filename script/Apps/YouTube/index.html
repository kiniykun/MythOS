<!DOCTYPE html><html><head><meta charset="utf-8"><title>YouTube</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>.logo img{height:22px;width:auto;display:block}.logo .wl{display:none}.light .logo .wl{display:block}.light .logo .wd{display:none}
:root{--accent:#ff0033;--bg:#0f0f11;--card:#1d1d20;--line:rgba(255,255,255,.1);--fg:#f5f5f7;--mut:rgba(235,235,245,.6);--hover:rgba(255,255,255,.08);--chip:rgba(255,255,255,.1);--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
html.light{--bg:#fff;--card:#f1f1f4;--line:rgba(0,0,0,.1);--fg:#111;--mut:rgba(0,0,0,.6);--hover:rgba(0,0,0,.06);--chip:rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font:13px/1.4 var(--os-font,var(--font));background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:6px;border:2px solid transparent;background-clip:content-box}
.top{min-height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:18px;letter-spacing:-.045em;cursor:pointer;flex:none}
.logo svg{width:32px;height:23px;filter:drop-shadow(0 1px 1.5px rgba(120,0,10,.45))}
.sb{flex:1;min-width:180px;max-width:560px;margin:0 auto;display:flex;height:36px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.sb:focus-within{box-shadow:inset 0 0 0 1px #3ea6ff}.sb input{flex:1;min-width:0;background:none;border:0;padding:0 16px}.sb button{width:54px;background:var(--hover);display:grid;place-items:center}
.sb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ib{height:32px;padding:0 12px;border-radius:16px;background:var(--hover);flex:none}.ib:hover{filter:brightness(1.2)}
.sel{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}.sel select{height:32px;border-radius:16px;background:var(--hover);border:0;padding:0 10px;max-width:150px}
.sel option{background:var(--card);color:var(--fg)}
.chips{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;flex:none;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{padding:6px 14px;border-radius:8px;background:var(--chip);white-space:nowrap;font-weight:500}.chips button.on{background:var(--fg);color:var(--bg)}
main{flex:1;overflow:auto;padding:4px 16px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 14px}
.card{cursor:pointer}.th{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--card) center/cover;overflow:hidden;transition:border-radius .2s}.card:hover .th{border-radius:4px}
.du{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11.5px;font-weight:600;padding:1px 5px;border-radius:4px}
.meta{display:flex;gap:10px;margin-top:10px}.ch{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6b7280,#374151);flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background-size:cover}
.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14px;line-height:1.3}.meta small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.more{display:block;margin:24px auto 0;padding:9px 26px;border-radius:20px;background:var(--hover);font-weight:600}
.msg{text-align:center;color:var(--mut);padding:70px 20px;font-size:14px;line-height:1.6}.msg h2{color:var(--fg);font-size:19px;margin-bottom:8px}.err{color:#ff6b6b}
.via{color:var(--mut);font-size:11.5px;padding:2px 2px 10px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}@media(max-width:900px){.watch{grid-template-columns:1fr}}
.vp{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.vp iframe{width:100%;height:100%;border:0;display:block}
.wt{font-size:19px;font-weight:700;margin:12px 0 6px;line-height:1.3}
.wr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.wr .ch{width:40px;height:40px}.wr b{display:block;font-size:14.5px}.wr small{color:var(--mut)}.wr .sp{flex:1}
.pill{padding:7px 14px;border-radius:18px;background:var(--chip);font-weight:600;text-decoration:none;color:inherit;display:inline-block}
.desc{margin-top:12px;padding:12px;border-radius:12px;background:var(--card);white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:hidden;cursor:pointer}.desc.open{max-height:none}.desc b{display:block;margin-bottom:6px}
.cm{display:flex;gap:12px;margin-top:16px}.cm .ch{width:36px;height:36px}.cm b{font-size:12.5px}.cm small{color:var(--mut);margin-left:6px}.cm p{margin-top:2px;word-break:break-word;white-space:pre-wrap}
h3{margin:22px 0 4px;font-size:16px}
.rel{display:flex;gap:10px;margin-bottom:12px;cursor:pointer}.rel .th{width:150px;flex:none;border-radius:8px}.rel b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:600}.rel small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.hide{display:none!important}
</style></head><body>

var NK={name:'YouTube (no key)',
 trend:function(cat,tok){return NK.search(CATQ[cat]||CATQ[''],tok)},
 search:function(q,tok){return nkc('search',{part:'snippet',type:'video',maxResults:24,q:q,pageToken:tok}).then(function(j){return nkh((j.items||[]).map(function(x){return x.id&&x.id.videoId}).filter(Boolean)).then(function(l){return{items:l,next:j.nextPageToken||''}})})},
 video:function(id){return nkh([id]).then(function(l){if(!l[0])throw new Error('Not found');return{v:l[0]}})},
 related:function(v){return nkc('search',{part:'snippet',type:'video',maxResults:12,q:v.snippet.title}).then(function(j){return nkh((j.items||[]).map(function(x){return x.id&&x.id.videoId}).filter(function(x){return x&&x!==v.id}))})},
 comments:function(id){return nkc('commentThreads',{part:'snippet',videoId:id,maxResults:25,order:'relevance',textFormat:'plainText'}).then(function(j){return(j.items||[]).map(function(c){var x=c.snippet.topLevelComment.snippet;return{a:x.authorDisplayName,img:x.authorProfileImageUrl,t:x.textDisplay,d:x.publishedAt,l:x.likeCount}})})}};
/* fresh public Invidious list (dead servers are skipped automatically) */
try{tmo('https://api.invidious.io/instances.json?sort_type=health').then(function(l){(l||[]).forEach(function(x){var i=x[1];if(i&&i.api&&i.cors&&i.type==='https'&&INVS.indexOf(i.uri)<0)INVS.unshift(i.uri)})},function(){})}catch(e){}
/* ---------- server 3: Piped (public instances) ---------- */
var PIPS=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.private.coffee','https://pipedapi.leptons.xyz'],pipI=0;
function viaPip(path){var n=PIPS.length,i=0;function go(){if(i>=n)return Promise.reject(new Error('No Piped server answered'));var b=PIPS[(pipI+i)%n];return tmo(b+path).then(function(j){pipI=(pipI+i)%n;return j},function(){i++;return go()})}return go()}
function vid(u){var m=/[?&]v=([\w-]{11})/.exec(u||'');return m?m[1]:''}
function pv(x){var id=vid(x.url);return id?mk(id,x.title,x.uploaderName,x.uploaded>0?new Date(x.uploaded).toISOString():'',x.views,x.duration>=0?x.duration:null,x.shortDescription):null}
var PIP={name:'Piped',
 trend:function(cat,tok){return viaPip('/trending?region='+REG()).then(function(l){return{items:(l||[]).map(pv).filter(Boolean),next:''}})},
 search:function(q,tok){var p=tok?'/nextpage/search?nextpage='+encodeURIComponent(tok)+'&q='+encodeURIComponent(q)+'&filter=videos':'/search?q='+encodeURIComponent(q)+'&filter=videos';return viaPip(p).then(function(j){return{items:(j.items||[]).map(pv).filter(Boolean),next:j.nextpage||''}})},
 video:function(id){return viaPip('/streams/'+id).then(function(j){var v=mk(id,j.title,j.uploader,j.uploadDate,j.views,j.duration,j.description,j.likes);v._rel=(j.relatedStreams||[]).map(pv).filter(Boolean);return{v:v}})},
 related:function(v){return Promise.resolve(v._rel||[])},
 comments:function(id){return viaPip('/comments/'+id).then(function(j){return(j.comments||[]).map(function(c){return{a:c.author,img:c.thumbnail,t:c.commentText,d:'',l:c.likeCount,when:c.commentedTime}})})}};
/* ---------- picking a server (with automatic failover) ---------- */
var via='';
function order(){var s=cfg('ytServer')||'auto';return s==='yt'?[YT]:s==='inv'?[INV]:s==='piped'?[PIP]:s==='nk'?[NK]:[YT,NK,INV,PIP]}
function run(m){var a=[].slice.call(arguments,1),L=order(),i=0,last;function go(){if(i>=L.length)return Promise.reject(last||new Error('No server answered'));var S=L[i++];return S[m].apply(S,a).then(function(r){via=S.name;showVia();return r},function(e){last=e;return go()})}return go()}
function showVia(){var e=$('via');if(e)e.textContent=via?'Served by '+via:''}
/* ---------- UI ---------- */
var CATS=[['Trending',''],['Music','10'],['Gaming','20'],['Entertainment','24'],['News','25'],['Sports','17'],['Education','27'],['Science & Tech','28']];
var state={mode:'trend',cat:'',q:'',tok:'',items:[]},chips=$('chips');
CATS.forEach(function(c,i){var b=document.createElement('button');b.textContent=c[0];if(!i)b.className='on';b.onclick=function(){[].forEach.call(chips.children,function(x){x.classList.remove('on')});b.classList.add('on');$('q').value='';state={mode:'trend',cat:c[1],q:'',tok:'',items:[]};load()};chips.appendChild(b)});
function cards(items){return items.map(function(v,i){var s=v.snippet,t=(s.thumbnails.high||s.thumbnails.medium||{}).url||'',vc=v.statistics&&v.statistics.viewCount;
 return'<div class="card" data-i="'+i+'"><div class="th" style="background-image:url(\''+esc(t)+'\')"><span class="du">'+esc(dur(v.contentDetails&&v.contentDetails.duration))+'</span></div><div class="meta"><div class="ch">'+esc((s.channelTitle||'?')[0])+'</div><div><b>'+esc(s.title)+'</b><small>'+esc(s.channelTitle)+'</small><small>'+(vc!=null&&num(vc)?num(vc)+' views':'')+(vc!=null&&num(vc)&&ago(s.publishedAt)?' · ':'')+ago(s.publishedAt)+'</small></div></div></div>'}).join('')}
function fail(e){var ky=/quota|key|API|403|400/i.test(e&&e.message||'');$('main').innerHTML='<div class="msg"><h2>Couldn’t load videos</h2><p class="err">'+esc(e&&e.message||'No server answered')+'</p><p style="margin-top:10px">Try another server in the bar above, or check your connection.</p><button class="more" id="rt">Try again</button> <button class="more" id="rk">Add my API key</button><p style="margin-top:12px;font-size:12px;opacity:.7">Free key: console.cloud.google.com → enable “YouTube Data API v3” → Credentials → API key. Open the OS over http://localhost, not as a file.</p></div>';$('rk').onclick=setKey;$('rt').onclick=function(){load()}}
function load(more){var m=$('main');if(!more){m.innerHTML='<div class="msg">Loading…</div>';state.items=[];state.tok=''}
 (state.mode==='search'?run('search',state.q,state.tok):run('trend',state.cat,state.tok)).then(function(r){state.items=state.items.concat(r.items);state.tok=r.next||'';draw()},function(e){if(state.items.length)draw();else fail(e)})}
function draw(){var m=$('main');if(!state.items.length){m.innerHTML='<div class="msg">No videos found.</div>';return}
 m.innerHTML='<div class="via" id="via"></div><div class="grid">'+cards(state.items)+'</div>'+(state.tok?'<button class="more" id="mb">Show more</button>':'');showVia();
 if($('mb'))$('mb').onclick=function(){this.textContent='Loading…';load(true)};
 [].forEach.call(m.querySelectorAll('.card'),function(c){c.onclick=function(){watch(state.items[+c.dataset.i])}})}
function hist(){try{return JSON.parse(P.localStorage.getItem('yt_hist')||'[]')}catch(e){return[]}}
function addHist(v){try{var h=hist().filter(function(x){return x.id!==v.id});h.unshift({id:v.id,snippet:v.snippet,contentDetails:v.contentDetails,statistics:v.statistics});P.localStorage.setItem('yt_hist',JSON.stringify(h.slice(0,60)))}catch(e){}}
var plI=0;
function embedUrl(id){var p=cfg('ytPlayer')||'nocookie';id=encodeURIComponent(id);if(p==='youtube')return'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';if(p==='inv')return INVS[(invI+plI)%INVS.length]+'/embed/'+id+'?autoplay=1';return'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1'}
function player(id){return'<div class="vp"><iframe src="'+esc(embedUrl(id))+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>'}
function watch(v){chips.classList.add('hide');var m=$('main');m.scrollTop=0;var id=v.id,s=v.snippet||{};
 m.innerHTML='<div class="watch"><div><div id="pl">'+player(id)+'</div><div class="wt" id="wt">'+esc(s.title||'Video')+'</div><div class="wr" id="wr"></div><div class="desc hide" id="ds"></div><h3 id="ch3"></h3><div id="cms"></div></div><div><h3 style="margin-top:0">Up next</h3><div id="rl"></div></div></div>';
 function fill(v){s=v.snippet;var st=v.statistics||{};addHist(v);
  $('wt').textContent=s.title;$('wr').innerHTML='<div class="ch">'+esc((s.channelTitle||'?')[0])+'</div><div><b>'+esc(s.channelTitle)+'</b><small>'+(st.viewCount!=null&&num(st.viewCount)?num(st.viewCount)+' views · ':'')+ago(s.publishedAt)+'</small></div><span class="sp"></span>'+(st.likeCount?'<span class="pill">👍 '+num(st.likeCount)+'</span>':'')+'<button class="pill" id="np">Try another player</button><a class="pill" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+encodeURIComponent(id)+'">Open on YouTube</a>';
  $('np').onclick=function(){plI++;var p=cfg('ytPlayer')||'nocookie',nx=p==='nocookie'?'youtube':p==='youtube'?'inv':'nocookie';if(p==='inv'&&plI%INVS.length)nx='inv';else plI=0;P.updateSysSetting('ytPlayer',nx);$('ply').value=nx;$('pl').innerHTML=player(id)};
  $('ds').classList.remove('hide');$('ds').innerHTML='<b>'+(st.viewCount!=null&&num(st.viewCount)?num(st.viewCount)+' views':'Description')+'</b>'+esc(s.description||'No description.');$('ds').onclick=function(){this.classList.toggle('open')};
  run('related',v).then(function(l){$('rl').innerHTML=(l||[]).slice(0,14).map(function(r,i){var t=(r.snippet.thumbnails.medium||{}).url||'';return'<div class="rel" data-i="'+i+'"><div class="th" style="background-image:url(\''+esc(t)+'\')"><span class="du">'+esc(dur(r.contentDetails&&r.contentDetails.duration))+'</span></div><div><b>'+esc(r.snippet.title)+'</b><small>'+esc(r.snippet.channelTitle)+'</small><small>'+(r.statistics&&num(r.statistics.viewCount)?num(r.statistics.viewCount)+' views':'')+'</small></div></div>'}).join('');[].forEach.call($('rl').children,function(c){c.onclick=function(){watch(l[+c.dataset.i])}})},function(){});
  run('comments',id).then(function(l){$('ch3').textContent='Comments';$('cms').innerHTML=l.map(function(c){return'<div class="cm"><div class="ch" style="background-image:url(\''+esc(c.img||'')+'\')"></div><div><b>'+esc(c.a)+'</b><small>'+esc(c.d?ago(c.d):(c.when||''))+'</small><p>'+esc(c.t)+'</p><small style="margin:0">👍 '+num(c.l)+'</small></div></div>'}).join('')},function(){$('ch3').textContent='Comments';$('cms').innerHTML='<small style="color:var(--mut)">Comments are turned off or unavailable for this video.</small>'})}
 run('video',id).then(function(r){fill(r.v)},function(){fill(v)})}
function parseId(t){var m=/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/.exec(t);if(m)return m[1];return/^[\w-]{11}$/.test(t)&&/[\d_A-Z-]/.test(t)?t:null}
function search(){var t=$('q').value.trim();chips.classList.remove('hide');if(!t){state={mode:'trend',cat:'',q:'',tok:'',items:[]};load();return}
 var id=parseId(t);if(id){watch({id:id,snippet:{title:'Video',thumbnails:{}}});return}
 [].forEach.call(chips.children,function(x){x.classList.remove('on')});state={mode:'search',cat:'',q:t,tok:'',items:[]};load()}
$('sf').onsubmit=function(e){e.preventDefault();search()};$('go').onclick=search;
$('home').onclick=function(){$('q').value='';chips.classList.remove('hide');chips.children[0].click()};
$('hist').onclick=function(){chips.classList.add('hide');var h=hist(),m=$('main');if(!h.length){m.innerHTML='<div class="msg"><h2>No watch history yet</h2>Videos you watch will show up here.</div>';return}
 m.innerHTML='<h3 style="margin:8px 0 14px">Watch history</h3><div class="grid">'+cards(h)+'</div><button class="more" id="clr">Clear history</button>';
 $('clr').onclick=function(){P.localStorage.removeItem('yt_hist');$('hist').click()};[].forEach.call(m.querySelectorAll('.card'),function(c){c.onclick=function(){watch(h[+c.dataset.i])}})};
$('srv').value=cfg('ytServer')||'auto';$('ply').value=cfg('ytPlayer')||'nocookie';
$('srv').onchange=function(){P.updateSysSetting('ytServer',this.value);chips.classList.remove('hide');load()};
$('ply').onchange=function(){P.updateSysSetting('ytPlayer',this.value)};
function setKey(){P.OSDlg.prompt('Paste your YouTube Data API v3 key (leave empty to use the built-in one):',cfg('youtubeApiKey')||'',function(k){if(k===null)return;P.updateSysSetting('youtubeApiKey',k.trim());load()})}
$('apik').onclick=setKey;
$('q').onkeydown=function(e){e.stopPropagation()};
load();
</script></body></html>
