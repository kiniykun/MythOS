<!DOCTYPE html><html><head><meta charset="utf-8"><title>Store</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--accent:#4cc2ff;--link:var(--accent);--bg:#1e1e20;--side:#29292c;--fill:rgba(120,120,128,.3);--fill2:rgba(120,120,128,.18);--line:rgba(255,255,255,.1);--fg:#f5f5f7;--mut:#98989f;--card:#2a2a2d;
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
html.light{--link:color-mix(in srgb,var(--accent) 62%,#000);--bg:#fff;--side:#f2f2f4;--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.1);--line:rgba(0,0,0,.1);--fg:#1d1d1f;--mut:#86868b;--card:#f5f5f7}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:13px var(--font);background:var(--bg);color:var(--fg);display:flex;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:6px;border:2px solid transparent;background-clip:content-box}
/* sidebar */
.side{width:232px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px 12px;gap:2px}
.sf{position:relative;margin-bottom:14px}
.sf label{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;background:var(--fill2);color:var(--mut)}
.sf label:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);background:var(--bg);color:var(--fg)}
.sf svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
.sf input{flex:1;min-width:0;background:none;border:0;font:inherit;color:var(--fg);user-select:text}.sf input::placeholder{color:var(--mut)}
.sug{position:absolute;left:0;right:0;top:36px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.4);padding:5px;z-index:30;display:none}.sug.on{display:block}
.sug div{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer}.sug div:hover,.sug div.h{background:var(--fill2)}.sug img{width:26px;height:26px;border-radius:6px}
.ni{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:9px;font-size:14px;width:100%;text-align:left;position:relative}
.ni svg{width:20px;height:20px;fill:none;stroke:var(--link);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni:hover{background:var(--fill2)}.ni.on{background:var(--fill);font-weight:600}
.bdg{margin-left:auto;background:#ff453a;color:#fff;border-radius:10px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:700}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;width:100%;text-align:left}.acct:hover{background:var(--fill2)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8e8e93,#636366);display:grid;place-items:center;flex-shrink:0}.av svg{width:16px;height:16px;fill:#fff}
.acct b{display:block;font-weight:500}.acct small{color:var(--mut);font-size:11.5px}
/* main */
.pg{flex:1;overflow:auto;scroll-behavior:smooth;position:relative}
.in{max-width:1120px;margin:0 auto;padding:26px 40px 70px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:14px}
.hd .dt{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.bk{display:inline-flex;align-items:center;gap:4px;color:var(--link);margin-bottom:12px;font-size:14px;padding:2px 0}.bk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.sech h2{font-size:22px;font-weight:700;letter-spacing:-.015em}.sech button{color:var(--link);font-size:14px}.sech button:hover{opacity:.75}
/* icons + buttons */
.ic{border-radius:22.37%;display:block;flex-shrink:0;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(0,0,0,.18);background:var(--fill)}
.gb{background:var(--fill);color:var(--link);font-weight:700;font-size:13px;letter-spacing:.01em;padding:0 19px;height:28px;border-radius:14px;min-width:70px;text-transform:uppercase;transition:filter .15s,transform .1s;white-space:nowrap}
.gb:hover{filter:brightness(1.2)}.gb:active{transform:scale(.95)}.gb.lg{height:32px;padding:0 26px;font-size:14px;border-radius:16px}
.gb.pr{background:var(--accent);color:#000}
.rg{width:28px;height:28px;position:relative;display:grid;place-items:center;border-radius:50%}.rg svg{width:28px;height:28px;transform:rotate(-90deg);position:absolute;inset:0}.rg circle{fill:none;stroke-width:2.4}.rg .t{stroke:var(--fill)}.rg .p{stroke:var(--link);stroke-linecap:round;transition:stroke-dashoffset .2s}.rg i{width:9px;height:9px;border-radius:2px;background:var(--link);display:block}
.bw{display:flex;align-items:center;justify-content:center;min-width:70px}
/* story cards */
.stories{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.story{position:relative;border-radius:20px;overflow:hidden;color:#fff;cursor:pointer;height:340px;background:linear-gradient(145deg,var(--g1),var(--g2));box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;isolation:isolate}
.story.big{grid-column:1/-1;height:440px}
.story:hover{transform:scale(1.012);box-shadow:0 18px 44px rgba(0,0,0,.35)}.story:active{transform:scale(.985)}
.story:before{content:"";position:absolute;width:75%;aspect-ratio:1;border-radius:50%;right:-14%;top:-30%;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 68%);z-index:-1}
.story:after{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%;left:-12%;bottom:-40%;background:radial-gradient(circle,rgba(0,0,0,.28),transparent 70%);z-index:-1}
.story .gl{position:absolute;right:7%;top:50%;width:46%;max-width:280px;transform:translateY(-62%) rotate(-8deg);opacity:.9;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));z-index:-1}
.story:not(.big) .gl{width:44%;right:5%;top:46%}
.stx{padding:26px 28px;max-width:62%;text-shadow:0 1px 14px rgba(0,0,0,.2)}
.stx small{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.82}
.stx h3{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.025em;margin:6px 0 8px}.story.big .stx h3{font-size:46px}
.stx p{font-size:15px;opacity:.9;line-height:1.35}
.sbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(30,30,32,.42);backdrop-filter:blur(26px) saturate(1.6)}
.sbar .ic{width:46px;height:46px;box-shadow:none}.sbar div.x{flex:1;min-width:0}.sbar b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbar small{opacity:.7;font-size:12px}
.sbar .gb{background:rgba(255,255,255,.26);color:#fff}
.sbar .rg .t{stroke:rgba(255,255,255,.3)}.sbar .rg .p{stroke:#fff}.sbar .rg i{background:#fff}
/* list stacks */
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:34px}
.rw{display:flex;align-items:center;gap:13px;padding:9px 0;cursor:pointer;position:relative;border-radius:10px}
.rw .ic{width:62px;height:62px}.rw .x{flex:1;min-width:0;padding-bottom:0}.rw b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rw:not(.last):after{content:"";position:absolute;left:75px;right:0;bottom:0;height:1px;background:var(--line)}
.rw .num{width:18px;text-align:center;color:var(--mut);font-weight:600;font-size:16px}
.rw.lgr .ic{width:76px;height:76px}.rw.lgr{padding:14px 0}.rw.lgr:after{left:89px}
.st{color:#ff9f0a;letter-spacing:1px;font-size:11px}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cat{height:112px;border-radius:16px;padding:16px 18px;color:#fff;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g1),var(--g2));transition:transform .25s}.cat:hover{transform:scale(1.03)}
.cat b{font-size:17px;font-weight:700;display:block}.cat small{opacity:.8}.cat svg{position:absolute;right:-6px;bottom:-12px;width:78px;height:78px;fill:none;stroke:#fff;stroke-width:1.2;opacity:.4;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;margin:0 0 6px}.chip{padding:5px 15px;border-radius:15px;background:var(--fill2);font-weight:500}.chip.on{background:var(--fg);color:var(--bg)}
/* product */
.pd{display:flex;gap:26px;align-items:flex-start;margin:6px 0 4px}.pd .ic{width:150px;height:150px}
.pd h1{font-size:30px}.pd .pub{color:var(--link);font-size:16px;margin-top:3px}.pd .sub{color:var(--mut);margin-top:3px;font-size:14px}
.acts{display:flex;align-items:center;gap:14px;margin-top:22px}
.shr{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--link)}.shr:hover{background:var(--fill2)}.shr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sts{display:flex;margin:26px 0 4px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:auto}
.sts div{flex:1;min-width:120px;text-align:center;padding:0 14px;border-right:1px solid var(--line);color:var(--mut);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}.sts div:last-child{border:0}
.sts b{display:block;color:var(--fg);font-size:21px;font-weight:700;margin:5px 0 2px;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sts em{font-style:normal;font-weight:400;text-transform:none;font-size:12px}
.shots{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px}.shot{height:230px;border-radius:14px;flex-shrink:0;box-shadow:0 0 0 1px var(--line);background:var(--card);object-fit:cover}
.whats{display:flex;justify-content:space-between;gap:20px;max-width:780px}.whats small{color:var(--mut)}
.desc{line-height:1.55;max-width:780px;white-space:pre-wrap;font-size:14px}.desc.c{max-height:84px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{color:var(--link);margin-top:6px;font-size:14px}
.rate{display:flex;align-items:center;gap:20px}.rate .n{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1}.rate small{color:var(--mut);display:block;margin-top:4px}
.info{max-width:780px}.info div{display:flex;gap:20px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}.info small{width:130px;color:var(--mut);flex-shrink:0;font-size:13.5px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.mini{width:150px;flex-shrink:0;cursor:pointer;text-align:left}.mini .ic{width:100px;height:100px;margin-bottom:9px}.mini b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini small{color:var(--mut);display:block;margin-bottom:8px}
.bg0{text-align:center;margin:90px auto 0;max-width:420px;color:var(--mut);line-height:1.5}.bg0 svg{width:64px;height:64px;margin:0 auto 14px;fill:none;stroke:var(--mut);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.bg0 h2{color:var(--fg);font-size:22px;margin-bottom:4px}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.li .ic{width:56px;height:56px}.li .x{flex:1}.li small{color:var(--mut)}
.menu{position:fixed;left:12px;bottom:60px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:5px;min-width:210px;box-shadow:0 14px 40px rgba(0,0,0,.45);z-index:50;display:none}.menu.on{display:block}
.menu div{padding:7px 12px;border-radius:7px;cursor:pointer}.menu div:hover{background:var(--accent);color:#000}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:22px;display:none;z-index:60;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.fade{animation:fi .35s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:820px){.side{width:64px;padding:12px 8px}.sf,.acct div,.ni span{display:none}.ni{justify-content:center;padding:0}.bdg{position:absolute;top:2px;right:6px;margin:0}.stories{grid-template-columns:1fr}.stx{max-width:100%}.in{padding:20px 20px 60px}.story .gl{opacity:.35}.pd .ic{width:100px;height:100px}}

/* ===== Microsoft Store look (override) ===== */
:root{--accent:#0067c0;--onacc:#fff;--font2:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
body{font-family:var(--font2)}
.side{width:84px;background:var(--side);align-items:center;padding:14px 0;gap:6px}
.sf{display:none}
.ni{width:60px;height:56px;flex-direction:column;gap:3px;border-radius:4px;font-size:10.5px;justify-content:center;padding:0}
.ni svg{width:20px;height:20px;stroke:var(--fg);stroke-width:1.5}
.ni.on{background:var(--fill);font-weight:600}.ni.on svg{stroke:var(--accent)}
.ni span{display:block!important;white-space:nowrap}
.acct{width:60px;height:56px;flex-direction:column;padding:0;border-radius:4px}
.acct div{display:none}.acct .av{width:26px;height:26px}
/* top search bar, Store-style */
.pg{position:relative}
.in{max-width:1180px;padding:0 32px 60px}
.in::before{content:"";display:block;height:56px}
.pg::before{content:"";position:sticky;top:0;left:0;right:0;height:56px;display:block;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
h1{font-weight:600;letter-spacing:0;font-size:26px}
.hd .dt{display:none}
.sech{border-top:0;margin-top:30px}
.sech h2{font-size:20px;font-weight:600}
.sech button{color:var(--accent);font-size:13px;font-weight:600}
/* flat, square app tiles and buttons */
.ic{border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.gb{border-radius:4px;background:var(--accent);color:var(--onacc);font-weight:600;text-transform:none;letter-spacing:0;min-width:84px;height:32px;font-size:13.5px}
.gb:hover{filter:none;background:color-mix(in srgb,var(--accent) 88%,#000)}
.gb.pr{background:var(--accent);color:var(--onacc)}
.gb.lg{height:36px;border-radius:4px}
.story,.cat{border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.story:hover,.cat:hover{transform:none;box-shadow:inset 0 0 0 1px var(--line),0 2px 10px rgba(0,0,0,.18)}
.chip{border-radius:4px}.chip.on{background:var(--accent);color:var(--onacc)}
.st{color:var(--accent);letter-spacing:0}
.rw:hover,.mini:hover{background:var(--fill2);border-radius:4px}
::-webkit-scrollbar-thumb{border-radius:3px}
@media(max-width:820px){.ni span{display:block!important}}
</style></head><body>

 <div id="nav"></div><div class="sp"></div>

 (more.length?'<div class="sech"><h2>You Might Also Like</h2></div><div class="row">'+more.map(function(x){return '<div class="mini" data-a="'+esc(x.id)+'"><img class="ic" src="'+esc(icon(x))+'" alt=""><b>'+esc(x.name)+'</b><small>'+esc(x.category||'')+'</small>'+btn(x)+'</div>'}).join('')+'</div>':'')},
updates:function(){var items=CATALOG.filter(function(a){return osId(a.id)}),q=Object.keys(dl);
 return head('Updates')+'<div style="display:flex;align-items:center;gap:14px"><button class="gb lg" id="upd">Check for Updates</button><span id="updm" style="color:var(--mut)">'+(window._chk?'Everything is up to date. Last checked '+window._chk:'')+'</span></div>'+
 (q.length?'<div class="sech"><h2>Downloading</h2></div>'+q.map(function(id){var a=A(id);return '<div class="li"><img class="ic" src="'+esc(icon(a))+'" alt=""><div class="x"><b>'+esc(a.name)+'</b><br><small>Installing…</small></div>'+btn(a)+'</div>'}).join(''):'')+
 '<div class="sech"><h2>Installed</h2></div>'+(items.length?items.map(function(a){return '<div class="li" data-a="'+esc(a.id)+'" style="cursor:pointer"><img class="ic" src="'+esc(icon(a))+'" alt=""><div class="x"><b>'+esc(a.name)+'</b><br><small>'+esc(a.publisher||'')+'</small></div><button class="gb" data-un="'+esc(a.id)+'">Remove</button>'+btn(a)+'</div>'}).join(''):'<div style="color:var(--mut);padding:10px 0">Apps you get from the Store show up here.</div>')},
help:function(){return head('Help')+'<div class="info">'+[['Getting apps','Press Get on any app. It installs in a few seconds and appears in Start and on the taskbar.'],['Updating','Open Updates and press Check for Updates.'],['Removing','Use Updates, or Settings → Apps.'],['Signing in','Optional. The Store works with a local account.']].map(function(x){return '<div><small>'+x[0]+'</small>'+x[1]+'</div>'}).join('')+'</div>'}
};
function catGrid(n){var c=CATS.slice(0,n||99);return '<div class="cats">'+c.map(function(x){var k=CATALOG.filter(function(a){return a.category===x[0]}).length;return '<div class="cat" data-cat="'+esc(x[0])+'" style="--g1:'+x[1]+';--g2:'+x[2]+'"><b>'+esc(x[0])+'</b><small>'+k+(k===1?' app':' apps')+'</small><svg viewBox="0 0 24 24">'+IC.apps+'</svg></div>'}).join('')+'</div>'}
function listFor(id){if(id==='free-apps')return byType('app').filter(function(a){return!a.price});if(id==='free-games')return byType('game').filter(function(a){return!a.price});if(id==='paid-apps')return byType('app').filter(function(a){return a.price});if(id==='paid-games')return byType('game').filter(function(a){return a.price});if(id.indexOf('cat:')===0)return CATALOG.filter(function(a){return catOf(a)===id.slice(4)});return CATALOG}
function go(page,p,noHist){if(cur&&!noHist)hist.push(cur);cur={page:page,p:p||{}};render()}
function render(){var c=cur,m=$('main');m.innerHTML='<div class="fade">'+P[c.page](c.p)+'</div>';$('pg').scrollTop=0;
 var nav=({discover:'discover',apps:'apps',games:'games',cats:'cats',updates:'updates'})[c.page]||(c.page==='product'||c.page==='list'?(c.nav||''):'');
 $('nav').innerHTML=NAV.map(function(n){return '<button class="ni'+(nav===n[0]?' on':'')+'" data-n="'+n[0]+'"><svg viewBox="0 0 24 24">'+IC[n[2]]+'</svg><span>'+n[1]+'</span>'+(n[0]==='updates'&&Object.keys(dl).length?'<i class="bdg">'+Object.keys(dl).length+'</i>':'')+'</button>'}).join('')}
function fetchApp(a){if(a.html!=null)return Promise.resolve({text:a.html});return fetch(a.src).then(function(r){if(!r.ok)throw new Error('Download failed');return /\.zip$/i.test(a.src)?r.blob().then(function(b){return{blob:b}}):r.text().then(function(t){return{text:t}})})}
function get(id){var a=A(id);if(!a||dl[id]!=null)return;if(!parent.AppHost){toast('Installing isn’t available here');return}dl[id]=0;refreshBtns();
 var t=setInterval(function(){dl[id]=Math.min(88,dl[id]+7+Math.random()*9);refreshBtns()},230);
 var fin=function(oid,msg){clearInterval(t);var was=dl[id]!=null;delete dl[id];if(!was){if(oid&&parent.AppHost)parent.AppHost.uninstall(oid);return}if(oid){inst[id]=oid;saveInst();toast(a.name+' installed')}else toast(msg||'Couldn’t install '+a.name);if(cur&&cur.page==='updates')render();else refreshBtns()};
 setTimeout(function(){fetchApp(a).then(function(r){if(dl[id]==null)return;dl[id]=96;refreshBtns();
  if(r.text!=null)return parent.AppHost.installText(a.name+'.html',r.text,false).then(function(o){fin(o)});
  return parent.AppHost.installFile(new File([r.blob],a.name+'.zip'),false).then(function(ids){fin(ids&&ids[0])})}).catch(function(e){fin(null,'Couldn’t install: '+(e.message||e))})},900)}
function menu(items){var m=$('menu');m.innerHTML=items.map(function(i){return i==='-'?'<hr>':'<div data-mi="'+i[0]+'">'+i[1]+'</div>'}).join('');m.classList.add('on')}
document.addEventListener('click',function(e){var t=e.target,m=$('menu');if(!t.closest('.menu')&&!t.closest('#acc'))m.classList.remove('on');if(!t.closest('.sf'))$('sug').classList.remove('on');var el;
 if(el=t.closest('[data-get]'))return get(el.dataset.get);
 if(el=t.closest('[data-cx]')){delete dl[el.dataset.cx];refreshBtns();return toast('Download cancelled')}
 if(el=t.closest('[data-op]')){var o=osId(el.dataset.op);if(o)parent.openWindow(o);return}
 if(el=t.closest('[data-un]')){var id=el.dataset.un,o2=osId(id);if(o2)parent.OSDlg.confirm('Uninstall this app? The app and its data will be removed from this PC.',function(){parent.AppHost.uninstall(o2).then(function(){delete inst[id];saveInst();toast('Removed');render()})},'Uninstall');return}
 if(t.closest('[data-share]'))return toast('Link copied');
 if(t.closest('[data-back]')){if(hist.length){cur=hist.pop();render()}return}
 if(el=t.closest('[data-a]'))return go('product',{id:el.dataset.a});
 if(el=t.closest('[data-n]'))return go(el.dataset.n==='discover'?'discover':el.dataset.n);
 if(el=t.closest('[data-all]')){var i2=el.dataset.all;return go('list',{id:i2,title:({'free-apps':'Top Free Apps','free-games':'Top Free Games','paid-apps':'Top Paid Apps','paid-games':'Top Paid Games'})[i2]||i2.replace('cat:','')})}
 if(el=t.closest('[data-cat]'))return go('list',{id:'cat:'+el.dataset.cat,title:el.dataset.cat});
 if(el=t.closest('[data-sf]')){cur.p.f=el.dataset.sf;return render()}
 if(t.id==='dmore'){var d=$('desc');d.classList.toggle('c');t.textContent=d.classList.contains('c')?'more':'less';return}
 if(t.id==='upd'){$('updm').textContent='Checking…';setTimeout(function(){window._chk=new Date().toLocaleString();if($('updm'))$('updm').textContent='Everything is up to date. Last checked '+window._chk},1000);return}
 if(el=t.closest('[data-mi]')){var k=el.dataset.mi;m.classList.remove('on');if(k==='upd')return go('updates');if(k==='help')return go('help');return toast(el.textContent+' isn’t available yet')}});
$('acc').onclick=function(e){e.stopPropagation();var m=$('menu');if(m.classList.contains('on')){m.classList.remove('on');return}menu([['si','Sign In'],['ac','Use a Local Account'],'-',['upd','Updates'],['red','Redeem Gift Card'],['help','Help']])};
var qi=$('q');
qi.addEventListener('input',function(){var v=this.value.trim().toLowerCase(),s=$('sug');if(!v){s.classList.remove('on');return}var l=CATALOG.filter(function(a){return a.name.toLowerCase().indexOf(v)>-1}).slice(0,5);
 s.innerHTML=l.map(function(a){return '<div data-a="'+esc(a.id)+'"><img class="ic" src="'+esc(icon(a))+'" alt="">'+esc(a.name)+'</div>'}).join('')+'<div data-s="1" style="color:var(--mut)">Search for “'+esc(this.value.trim())+'”</div>';s.classList.add('on')});
$('sug').addEventListener('click',function(e){var s=e.target.closest('[data-s]');this.classList.remove('on');if(s)runSearch();else qi.value=''});
function runSearch(){var v=qi.value.trim();if(!v)return;$('sug').classList.remove('on');if(cur&&cur.page==='search'){cur.p={q:v};render()}else go('search',{q:v})}
qi.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')runSearch();if(e.key==='Escape'){this.value='';$('sug').classList.remove('on')}});
go('discover',null,true);
