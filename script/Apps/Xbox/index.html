<!DOCTYPE html><html><head><meta charset="utf-8"><title>Xbox</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}html,body{height:100%}
body{font:14px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#fff;background:#04060a;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
.bg{position:fixed;inset:0;background:radial-gradient(60% 45% at 50% 0%,rgba(16,124,16,.28),transparent 70%),radial-gradient(50% 40% at 90% 100%,rgba(90,40,160,.25),transparent 70%),radial-gradient(40% 35% at 5% 80%,rgba(200,90,30,.14),transparent 70%),#04060a}
.day{position:fixed;top:clamp(10px,4vh,36px);left:0;right:0;text-align:center;font:600 clamp(26px,5.2vw,52px)/1 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:.42em;padding-left:.42em;color:rgba(255,255,255,.2);text-shadow:0 0 30px rgba(155,240,11,.18);pointer-events:none}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:clamp(12px,3vh,22px) 26px 0;margin-top:clamp(36px,10vh,92px)}
.who{display:flex;align-items:center;gap:12px}.who img{width:34px;height:34px;filter:drop-shadow(0 0 10px rgba(16,160,16,.55))}
.who b{display:block;font-size:15px;font-weight:600}.who small{display:block;font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.62);transition:background .15s,color .15s}.ib:hover,.ib:focus-visible{background:rgba(255,255,255,.14);color:#fff}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.srch{display:none;align-items:center;height:36px;border-radius:18px;background:rgba(255,255,255,.1);padding:0 14px;width:min(260px,36vw)}.srch.on{display:flex}.srch input{flex:1;background:none;border:0;color:#fff;font:inherit;min-width:0;user-select:text}
.prof{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#2a2f3a,#12151c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}.prof:hover{box-shadow:inset 0 0 0 2px #9bf00b}
.st{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.7);font-size:13px;margin-left:6px}.st svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bat{display:flex;align-items:center}.bat i{display:block;width:20px;height:10px;border-radius:3px;border:1.5px solid currentColor;position:relative;padding:1px}.bat i::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}.bat s{display:block;height:100%;background:currentColor;border-radius:1px;width:100%}
.stage{flex:1;min-height:0;display:flex;align-items:center}
.car{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);overflow-x:auto;overflow-y:hidden;padding:30px 50vw;width:100%;scrollbar-width:none;scroll-behavior:smooth}.car::-webkit-scrollbar{display:none}
.tile{--h:clamp(170px,36vh,300px);flex:none;position:relative;height:var(--h);width:calc(var(--h)*.74);border-radius:10px;overflow:hidden;opacity:.62;transform:scale(.92);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .22s,opacity .22s,box-shadow .22s}
.tile.sel{opacity:1;transform:scale(1.14);z-index:2;box-shadow:0 22px 50px rgba(0,0,0,.7),0 0 0 3px #7cd620,0 0 36px rgba(124,214,32,.35)}
.tile svg.art{position:absolute;inset:0;width:100%;height:100%}
.tile .gt{position:absolute;left:0;right:0;top:14%;text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.5)}.gt span{display:block;font:800 clamp(8px,1.1vw,12px)/1 "Arial Black",Impact,sans-serif;letter-spacing:.26em;padding-left:.26em}.gt em{display:block;font:900 clamp(38px,6.4vw,70px)/1 "Arial Black",Impact,sans-serif;font-style:normal;margin-top:4px}
.tile .nm{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-weight:600;font-size:13.5px}.tile .nm small{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.62);margin-top:1px}
.usr{background:linear-gradient(160deg,#27355f,#0c1120)}.usr .t{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:40px;font:800 58px "Arial Black",sans-serif;color:rgba(255,255,255,.85)}
.add{display:grid;place-items:center;text-align:center;border:2px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.04);color:rgba(255,255,255,.75)}.add i{display:block;font:300 44px/1 sans-serif;font-style:normal}
.cards{flex:none;display:flex;gap:14px;padding:0 26px;justify-content:center}
.wc{flex:1;max-width:340px;min-width:0;height:clamp(84px,15vh,118px);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);transition:transform .18s,box-shadow .18s}
.wc:hover,.wc:focus-visible{transform:scale(1.035);box-shadow:0 0 0 3px #7cd620}.wc b{font-size:15px;font-weight:600}.wc small{margin-top:2px;font-size:11.5px;color:rgba(255,255,255,.72)}
.wc.g{background:linear-gradient(135deg,#0f6b19,#0a3a14)}.wc.d{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03))}.wc.p{background:linear-gradient(135deg,#7a2bd0,#e0437f 70%,#ff9a3c)}
.handle{flex:none;width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);margin:16px auto 6px}
.dock{flex:none;display:flex;justify-content:center;align-items:center;gap:clamp(10px,2.2vw,22px);padding:6px 20px clamp(12px,2.6vh,20px)}
.dock button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);transition:transform .15s,background .15s}.dock button:hover,.dock button:focus-visible{transform:translateY(-3px) scale(1.12);background:rgba(255,255,255,.16)}.dock img{width:24px;height:24px;object-fit:contain;border-radius:5px}.dock svg{width:20px;height:20px;fill:currentColor}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.62);backdrop-filter:blur(10px);z-index:9}.ov.on{display:grid}
.card{width:min(520px,92vw);max-height:84vh;overflow:auto;padding:24px;border-radius:16px;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(8,10,16,.88));box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.14);user-select:text}
.card h3{font-size:22px;margin-bottom:4px}.card p{color:rgba(255,255,255,.72);line-height:1.5;margin:8px 0 18px}.card input{width:100%;margin:0 0 10px;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit}
.btns{display:flex;gap:10px;justify-content:flex-end}.btn{padding:8px 20px;border-radius:8px;background:rgba(255,255,255,.12)}.btn.g{background:#107c10}.btn:hover{filter:brightness(1.2)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:14px 0 6px}.apps button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;text-align:center}.apps button:hover{background:rgba(255,255,255,.16)}.apps img{width:34px;height:34px;object-fit:contain;border-radius:8px}
@media(max-width:620px){.st .tm,.st .bat{display:none}.cards .wc:nth-child(3){display:none}}
</style></head><body><div class="bg"></div><div class="day" id="day"></div>

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var KEY='xbox_games',mine=[],sel=0,filt='';try{mine=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mine))}catch(e){}}
function days(){var d=Math.ceil((new Date(2026,10,19)-new Date(new Date().setHours(0,0,0,0)))/864e5);return d>1?d+' days to go':d===1?'Tomorrow':d===0?'Out today':'Out now'}
var ART='<svg class="art" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f5c"/><stop offset=".5" stop-color="#e0437f"/><stop offset=".85" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd27a"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ff7a59"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#3a1458"/></linearGradient></defs><rect width="300" height="400" fill="url(#a)"/><circle cx="170" cy="235" r="62" fill="url(#b)"/><g fill="#2a0f4d" opacity=".85"><rect x="20" y="262" width="20" height="40"/><rect x="46" y="246" width="24" height="56"/><rect x="236" y="256" width="22" height="46"/><rect x="264" y="272" width="26" height="30"/></g><rect y="300" width="300" height="100" fill="url(#c)"/><g fill="none" stroke="#150726" stroke-linecap="round"><path d="M52 400C58 350 50 312 62 262" stroke-width="8"/><path d="M62 262q-40-18-70 10M62 262q-26-32-64-26M62 262q8-38 48-40M62 262q36-20 70 4" stroke-width="5"/></g></svg>';
function items(){var a=[{k:'gta'}];mine.forEach(function(g,i){a.push({k:'u',i:i,g:g})});a.push({k:'add'});if(!filt)return a;return a.filter(function(x){return x.k==='gta'?'grand theft auto vi gta':x.k==='u'?x.g.name.toLowerCase().indexOf(filt)>-1:false}).filter(function(x){return x.k==='u'?true:('grand theft auto vi gta'.indexOf(filt)>-1)})}
function draw(){var l=items();if(sel>=l.length)sel=Math.max(0,l.length-1);
 $('car').innerHTML=l.length?l.map(function(x,n){var c='tile'+(n===sel?' sel':'');
  if(x.k==='gta')return'<button class="'+c+'" data-n="'+n+'">'+ART+'<div class="gt"><span>GRAND THEFT AUTO</span><em>VI</em></div><div class="nm">Grand Theft Auto VI<small>Rockstar Games · '+days()+'</small></div></button>';
  if(x.k==='u')return'<button class="'+c+' usr" data-n="'+n+'"><div class="t">'+esc(x.g.name.charAt(0).toUpperCase())+'</div><div class="nm">'+esc(x.g.name)+'<small>Web game</small></div></button>';
  return'<button class="'+c+' add" data-n="'+n+'"><div><i>+</i>Add a game</div></button>'}).join(''):'<div style="margin:auto;color:rgba(255,255,255,.6)">No games match.</div>';
 var s=document.querySelector('.tile.sel');if(s)s.scrollIntoView({inline:'center',block:'nearest'})}
function move(d){var n=items().length;sel=Math.max(0,Math.min(n-1,sel+d));draw()}
function modal(h){$('card').innerHTML=h;$('ov').classList.add('on')}function close(){$('ov').classList.remove('on')}
function iconOf(id){try{var a=P.APPS[id];return new URL(a.icon,P.location.href).href}catch(e){return''}}
function lib(){var ids=[],h='';try{ids=Object.keys(P.APPS).filter(function(k){return k!=='xbox'})}catch(e){}
 h='<h3>My games &amp; apps</h3><p>Everything installed on this PC.</p>';
 if(mine.length)h+='<div class="apps">'+mine.map(function(g,i){return'<button data-link="'+esc(g.url)+'"><div class="usr" style="width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:800">'+esc(g.name.charAt(0).toUpperCase())+'</div>'+esc(g.name)+'</button>'}).join('')+'</div>';
 h+='<div class="apps">'+ids.map(function(k){var a=P.APPS[k],ic=iconOf(k);return'<button data-open="'+esc(k)+'">'+(ic?'<img src="'+esc(ic)+'" alt="">':'')+esc(a.title||k)+'</button>'}).join('')+'</div><div class="btns"><button class="btn" data-x="1">Close</button></div>';modal(h)}
function dockBuild(){var ids=['store','browser','music','youtube','explorer','customize','settings'],h='<button data-act="lib" title="All apps"><img src="'+LOGO+'" alt=""></button>';
 ids.forEach(function(k){try{if(P.APPS[k]){h+='<button data-open="'+k+'" title="'+esc(P.APPS[k].title||k)+'"><img src="'+esc(iconOf(k))+'" alt=""></button>'}}catch(e){}});$('dock').innerHTML=h}
$('ov').onclick=function(e){if(e.target===this)close()};
document.addEventListener('keydown',function(e){var t=e.target.tagName;if(t==='INPUT')return;if(e.key==='Escape')close();if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key==='Enter'){var x=items()[sel];if(x)act(x)}});
var wt=0;$('car').addEventListener('wheel',function(e){e.preventDefault();var n=Date.now();if(n-wt<140)return;wt=n;move((e.deltaY||e.deltaX)>0?1:-1)},{passive:false});
function act(x){if(x.k==='gta')modal('<h3>Grand Theft Auto VI</h3><small style="color:#9bf00b">Rockstar Games · Releases Nov 19, 2026</small><p>Coming to PlayStation 5 and Xbox Series X|S. It is a console game, so it can’t be played inside MythOS. Tap below for the official page.</p><div class="btns"><button class="btn" data-x="1">Close</button><button class="btn g" data-link="https://www.rockstargames.com/VI">Official page</button></div>');
 else if(x.k==='u')modal('<h3>'+esc(x.g.name)+'</h3><p>'+esc(x.g.url)+'</p><div class="btns"><button class="btn" data-del="'+x.i+'">Remove</button><button class="btn" data-x="1">Close</button><button class="btn g" data-link="'+esc(x.g.url)+'">Play</button></div>');
 else{modal('<h3>Add a game</h3><p>Add a web game and it shows up here.</p><input id="gn" placeholder="Game name"><input id="gu" placeholder="https://…"><div class="btns"><button class="btn" data-x="1">Cancel</button><button class="btn g" data-save="1">Add</button></div>');$('gn').focus()}}
document.body.onclick=function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
 if(d.n!=null){var n=+d.n;if(n===sel){act(items()[n])}else{sel=n;draw()}return}
 if(d.lock){try{P.lockNow()}catch(x){}return}
 if(d.open){close();try{P.openWindow(d.open)}catch(x){}return}
 if(d.act==='lib'){lib();return}
 if(d.act==='search'){var s=$('srch');s.classList.toggle('on');if(s.classList.contains('on'))$('sq').focus();else{$('sq').value='';filt='';sel=0;draw()}return}
 if(d.x){close();return}
 if(d.link){window.open(d.link,'_blank','noopener');return}
 if(d.del){mine.splice(+d.del,1);save();close();draw();return}
 if(d.save){var n2=$('gn').value.trim(),u=$('gu').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;if(!n2||!/^https?:\/\/.+\..+/i.test(u))return;mine.push({name:n2,url:u});save();close();sel=items().length-2;draw()}};
$('sq').oninput=function(){filt=this.value.trim().toLowerCase();sel=0;draw()};$('sq').onkeydown=function(e){e.stopPropagation()};
function tick(){var d=new Date();$('clk').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('day').textContent=d.toLocaleDateString([],{weekday:'long'}).toUpperCase()}
try{var nm=P.sysConfig.userName||'Player';$('usr').textContent=nm;$('prof').textContent=nm.charAt(0).toUpperCase()}catch(e){}
try{navigator.getBattery().then(function(b){var u=function(){$('bat').style.width=Math.round(b.level*100)+'%'};u();b.onlevelchange=u})}catch(e){}
tick();setInterval(tick,20000);dockBuild();draw();
</script></body></html>
