name: Unpack MythOS

on:
  push:
    branches: [main, master]
    paths: ['MythOS.zip']
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path of the zip inside the repo'
        default: 'MythOS.zip'
      remove_old_files:
        description: 'Delete files that are not in the new zip'
        type: boolean
        default: true
      delete_zip:
        description: 'Delete the zip after unpacking'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: unpack-mythos
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Find the zip
        id: zip
        env:
          ZIP: ${{ github.event.inputs.zip_path || 'MythOS.zip' }}
        run: |
          if [ ! -f "$ZIP" ]; then
            echo "::error::Could not find $ZIP in the repo. Upload it to the repo root first."
            exit 1
          fi
          unzip -tq "$ZIP" >/dev/null || { echo "::error::$ZIP is not a valid zip file."; exit 1; }
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unpack into a temporary folder
        env:
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          rm -rf "$RUNNER_TEMP/unpacked"
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unpacked"
          rm -rf "$RUNNER_TEMP/unpacked/__MACOSX"
          find "$RUNNER_TEMP/unpacked" -name '.DS_Store' -delete
          SRC="$RUNNER_TEMP/unpacked"
          if [ "$(find "$SRC" -mindepth 1 -maxdepth 1 | wc -l)" = "1" ] && [ -d "$(find "$SRC" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$SRC" -mindepth 1 -maxdepth 1)"
          fi
          if [ ! -f "$SRC/index.html" ]; then
            echo "::error::No index.html found in the zip. This does not look like a MythOS download."
            exit 1
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Copy files into the repo
        env:
          ZIP: ${{ steps.zip.outputs.path }}
          REMOVE_OLD: ${{ github.event.inputs.remove_old_files || 'true' }}
        run: |
          EXCLUDES=(--exclude='.git/' --exclude='.github/' --exclude="/$ZIP")
          if [ "$REMOVE_OLD" = "true" ]; then
            rsync -a --delete "${EXCLUDES[@]}" "$SRC"/ ./
          else
            rsync -a "${EXCLUDES[@]}" "$SRC"/ ./
          fi

      - name: Remove the zip (optional)
        if: ${{ github.event.inputs.delete_zip == 'true' }}
        run: rm -f "${{ steps.zip.outputs.path }}"

      - name: Commit the unpacked files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed. The repo already matches the zip."
            exit 0
          fi
          git commit -m "Unpack MythOS.zip"
          git push
